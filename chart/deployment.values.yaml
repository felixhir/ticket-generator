image:
  registry: ghcr.io
  repository: felixhir/ticket-generator
  tag: 8ca50b494450d345fffdb8ce68ca3a9415bdd8c8
  pullPolicy: IfNotPresent
istioRouting:
  enabled: true
  domain: ticket-generator.scholl.tech
certificate:
  enabled: true
  namespace: istio-system
  issuerName: letsencrypt
  issuerKind: ClusterIssuer
secretStore: vault
secretRemoteKey: artus-engineering-workload/ticket-generator/runtime
externalCredentialsRemoteKey: artus-engineering-workload/ticket-generator/external
externalSecrets:
  enabled: true
  k8sSecretName: ticket-generator
secrets:
  - secretKey: ALTCHA_HMAC_SECRET
    remoteAttributeName: altchaHmacSecret
externalCredentialSecrets:
  - secretKey: TICKETMASTER_API_KEY
    remoteAttributeName: ticketmasterApiKey
secretEnv:
  - name: ALTCHA_HMAC_SECRET
    existingSecret: ticket-generator
  - name: TICKETMASTER_API_KEY
    existingSecret: ticket-generator
