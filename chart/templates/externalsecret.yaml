{{- if .Values.externalSecrets.enabled }}
{{- $hasRuntime := and .Values.secretRemoteKey .Values.secrets }}
{{- $hasExternal := and .Values.externalCredentialsRemoteKey .Values.externalCredentialSecrets }}
{{- if $hasRuntime }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ticket-generator.fullname" . }}
  labels:
    {{- include "ticket-generator.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 3600s
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStore | quote }}
  target:
    name: {{ .Values.externalSecrets.k8sSecretName | quote }}
    creationPolicy: CreateOrMerge
  data:
    {{- range .Values.secrets }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ $.Values.secretRemoteKey | quote }}
        property: {{ .remoteAttributeName | quote }}
    {{- end }}
{{- end }}
{{- if $hasExternal }}
{{- if $hasRuntime }}
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-external" (include "ticket-generator.fullname" .) }}
  labels:
    {{- include "ticket-generator.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 3600s
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalCredentialsSecretStore | default "vault" | quote }}
  target:
    name: {{ .Values.externalSecrets.k8sSecretName | quote }}
    creationPolicy: {{ if $hasRuntime }}Merge{{ else }}CreateOrMerge{{ end }}
  data:
    {{- range .Values.externalCredentialSecrets }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ $.Values.externalCredentialsRemoteKey | quote }}
        property: {{ .remoteAttributeName | quote }}
    {{- end }}
{{- end }}
{{- end }}
